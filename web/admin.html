<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영 · DNA Labs</title>
<!-- 검색에 걸릴 이유가 없습니다. 막아 두는 것이 보안은 아니지만, 굳이 알릴 것도 아닙니다. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* 색과 서체는 세 앱과 같은 것을 씁니다. 운영 화면만 따로 놀면
   같은 회사 물건으로 안 보이고, 고칠 때 두 벌을 맞춰야 합니다. */
:root{
  --bg:#FFFFFF; --bg2:#F2F4F6; --ink:#191F28; --sub:#4E5968; --mut:#8B95A1; --dim:#B0B8C1;
  --line:#E5E8EB; --fill:#F2F4F6; --fill2:#F9FAFB;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-bg:#E8F3FF;
  --red:#F04452;  --red-bg:#FDEEF0;
  --green:#00A66C; --green-bg:#E4F6EF;
  --amber:#E08700; --amber-bg:#FFF4DF;
  --violet:#7C5CFC; --violet-bg:#F0EBFF;
  --r:16px; --rs:12px; --sh:0 1px 2px rgba(25,31,40,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg2);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:1rem;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:-.02em}
input,select{font:inherit;color:inherit;letter-spacing:-.02em}

/* ───── 들어오는 화면 ───── */
#gate{
  position:fixed;inset:0;z-index:50;background:#12161C;color:#E7EAEE;
  display:flex;overflow:auto;padding:24px;
}
#gate .box{margin:auto;width:100%;max-width:400px;text-align:center}
#gate .mark{width:92px;height:92px;border-radius:50%;margin:0 auto 26px;display:block}
#gate h1{font-size:1.5rem;font-weight:800;letter-spacing:-.045em;margin:0 0 6px}
#gate .sub{font-size:.9rem;color:#8E97A3;margin:0 0 30px}
#gate .field{text-align:left;margin-bottom:14px}
#gate label{display:block;font-size:.82rem;font-weight:700;color:#98A2AE;margin-bottom:7px}
#gate input{
  width:100%;height:52px;padding:0 15px;border-radius:12px;
  border:1px solid #2A313A;background:#1A1F26;color:#E7EAEE;font-size:1rem;
}
#gate input:focus{outline:0;border-color:var(--blue)}
#gate input::placeholder{color:#5C6675}
#gate .go{
  width:100%;height:54px;border-radius:12px;background:var(--blue);color:#fff;
  font-weight:800;font-size:1.02rem;margin-top:8px;
}
#gate .go:disabled{opacity:.5}
#gate .msg{min-height:22px;margin-top:14px;font-size:.86rem;font-weight:600;color:#FF8A93}
#gate .foot{margin-top:26px;font-size:.8rem;color:#6B7583;line-height:1.7}

/* ───── 위 막대 ───── */
.top{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.top .in{max-width:1080px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:12px}
.top .logo{width:30px;height:30px;border-radius:50%;flex:none}
.top .nm{font-weight:800;letter-spacing:-.04em}
.top .nm b{color:var(--blue)}
.top .sp{flex:1}
.top .who{font-size:.86rem;font-weight:700;color:var(--sub)}
.top .out{font-size:.82rem;font-weight:700;color:var(--mut);padding:6px 10px;border-radius:8px}
.top .out:hover{background:var(--fill)}

.tabs{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;gap:4px;border-bottom:1px solid var(--line);background:#fff}
.tabs button{
  padding:13px 14px;font-size:.9rem;font-weight:700;color:var(--mut);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
h2.pt{font-size:1.35rem;font-weight:800;letter-spacing:-.045em;margin:0 0 4px}
p.ps{font-size:.88rem;color:var(--mut);margin:0 0 20px}
.bar{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.bar .sp{flex:1}

/* ───── 요약 ───── */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:700px){ .sum{grid-template-columns:repeat(2,1fr)} }
.sum .b{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.sum .b .n{font-size:1.5rem;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.sum .b .k{font-size:.8rem;font-weight:600;color:var(--mut);margin-top:2px}

/* ───── 회사 ───── */
.co{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:12px;display:block;width:100%;text-align:left;
}
.co:hover{border-color:var(--dim)}
.co .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.co .code{
  font-size:.76rem;font-weight:800;letter-spacing:.02em;
  background:var(--fill);color:var(--sub);padding:3px 8px;border-radius:6px;
}
.co .name{font-size:1.06rem;font-weight:800;letter-spacing:-.035em}
.co .sp{flex:1}
.co .apps{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.rebind{background:var(--blue-bg);color:var(--blue-d)}
.tag.recall{background:var(--green-bg);color:var(--green)}
.tag.restore{background:var(--violet-bg);color:var(--violet)}
.tag.none{background:var(--red-bg);color:var(--red)}
.tag.off{background:var(--fill);color:var(--mut)}
.co .use{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;font-size:.84rem;color:var(--sub)}
.co .use b{font-weight:800;font-variant-numeric:tabular-nums}
.co .use .q{color:var(--mut);font-weight:600}

/* ───── 표 ───── */
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl .r{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.tbl .r:first-child{border-top:0}
.tbl .r .m{flex:1;min-width:0}
.tbl .r .t1{font-size:.94rem;font-weight:700}
.tbl .r .t2{font-size:.79rem;color:var(--mut);margin-top:2px}
.tbl .r .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:34px 18px;text-align:center;color:var(--mut);font-size:.9rem}

/* ───── 단추 ───── */
.btn{
  height:44px;padding:0 18px;border-radius:11px;background:var(--blue);color:#fff;
  font-weight:700;font-size:.94rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{background:var(--blue-d)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--dim)}
.btn.ghost{background:var(--fill);color:var(--sub)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red-bg)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{height:34px;padding:0 12px;font-size:.83rem;border-radius:9px}
.btn:disabled{opacity:.45;pointer-events:none}

/* ───── 시트 ───── */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(15,20,26,.42);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;
}
.sheet .card{
  background:#fff;border-radius:20px;width:100%;max-width:520px;margin:auto;
  padding:26px;box-shadow:0 24px 60px rgba(15,20,26,.28);
}
.sheet h3{font-size:1.2rem;font-weight:800;letter-spacing:-.04em;margin:0 0 4px}
.sheet .note{font-size:.85rem;color:var(--mut);margin:0 0 20px;line-height:1.65}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:700;color:var(--sub);margin-bottom:6px}
.inp{
  width:100%;height:46px;padding:0 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--fill2);font-size:.96rem;
}
.inp:focus{outline:0;border-color:var(--blue);background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:.88rem;font-weight:700;color:var(--mut);
}
.pick[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.btnrow{display:flex;gap:10px;margin-top:22px}
.btnrow .btn{flex:1}
.warn{
  background:var(--amber-bg);color:#8A5300;border-radius:var(--rs);
  padding:12px 14px;font-size:.85rem;font-weight:600;line-height:1.6;margin:0 0 16px;
}
.warn.stop{background:var(--red-bg);color:#9B1B27}
.warn.info{background:var(--blue-bg);color:#124A9E}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem}

/* 새로 만든 비밀번호를 한 번만 보여 주는 자리 */
.pwbox{
  background:var(--ink);color:#fff;border-radius:var(--rs);padding:16px 18px;margin:16px 0;
}
.pwbox .k{font-size:.76rem;color:#98A2AE;font-weight:700}
.pwbox .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.1rem;font-weight:700;margin-top:4px;word-break:break-all}

/* 알림 */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.18s;z-index:60;
  max-width:calc(100vw - 40px);text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 기록 */
.log .r{display:flex;gap:12px;padding:11px 18px;border-top:1px solid var(--line);font-size:.85rem}
.log .r:first-child{border-top:0}
.log .at{color:var(--mut);flex:0 0 132px;font-variant-numeric:tabular-nums}
.log .ac{font-weight:700;flex:0 0 190px}
.log .rest{flex:1;color:var(--sub);min-width:0}
@media(max-width:640px){
  .log .r{flex-wrap:wrap;gap:4px 10px}
  .log .at,.log .ac{flex:none}
}
</style>
</head>
<body>

<!-- ═════════ 들어오는 화면 ═════════ -->
<div id="gate">
  <div class="box">
    <img class="mark" id="gateMark" alt="DNA Labs">
    <h1>운영</h1>
    <p class="sub">DNA Labs 사람만 들어옵니다</p>
    <form id="gateForm" autocomplete="on">
      <div class="field">
        <label for="g-code">회사 코드</label>
        <input id="g-code" name="organization" placeholder="예: ABCDEF" autocapitalize="characters"
               autocorrect="off" spellcheck="false" maxlength="12">
      </div>
      <div class="field">
        <label for="g-id">아이디</label>
        <input id="g-id" name="username" placeholder="예: gdhong" autocapitalize="off"
               autocorrect="off" spellcheck="false" autocomplete="username">
      </div>
      <div class="field">
        <label for="g-pw">비밀번호</label>
        <input id="g-pw" name="password" type="password" placeholder="비밀번호"
               autocapitalize="none" autocorrect="off" autocomplete="current-password" spellcheck="false">
      </div>
      <button class="go" id="g-go" type="submit">들어가기</button>
    </form>
    <div class="msg" id="gateMsg"></div>
    <div class="foot">
      여기는 고객사용 화면이 아닙니다.<br>
      서비스를 쓰시려면 <a href="/reservice" style="color:#8FB8F5">dnalabs.kr/reservice</a> 로 가세요.
    </div>
  </div>
</div>

<!-- ═════════ 본 화면 ═════════ -->
<div id="app" hidden>
  <div class="top">
    <div class="in">
      <img class="logo" id="topMark" alt="">
      <span class="nm">DNA <b>Labs</b> 운영</span>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <button class="out" id="signOut">나가기</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-p="co" aria-selected="true">회사</button>
    <button data-p="log" aria-selected="false">기록</button>
  </div>

  <main>
    <!-- ── 회사 ── -->
    <section id="p-co">
      <div class="bar">
        <div>
          <h2 class="pt">회사</h2>
          <p class="ps" id="coSub">—</p>
        </div>
        <span class="sp"></span>
        <button class="btn" id="newCo">+ 회사 만들기</button>
      </div>
      <div class="sum" id="sum"></div>
      <div id="coList"></div>
    </section>

    <!-- ── 기록 ── -->
    <section id="p-log" hidden>
      <h2 class="pt">기록</h2>
      <p class="ps">최근 100건입니다. 누가 무엇을 했는지 남습니다.</p>
      <div class="tbl log" id="logList"></div>
    </section>
  </main>
</div>

<!-- ═════════ 시트 ═════════ -->
<div class="sheet" id="sheet" hidden><div class="card" id="sheetCard"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => Number(n || 0).toLocaleString('ko-KR');

const SB_URL = 'https://izrtclsqhsgkuwsffifn.supabase.co';
const SB_KEY = 'sb_publishable_G5wx-YdgwUU630x1vKmZmQ_15BgxvEX';
const OPS = SB_URL + '/functions/v1/ops';

/* 로그인 보관 자리를 세 앱과 **따로** 씁니다(앱은 'ndna-auth').
   같은 주소(dnalabs.kr) 아래라 그냥 두면 한 자리를 나눠 쓰게 되고,
   운영 화면에서 나가면 열어 두었던 /bind 까지 함께 끊깁니다.
   반대로 고객사 계정으로 앱에 들어가 있으면 여기에도 그 사람이 들어와 있게 됩니다. */
let sb = null;
function sbInit(){
  if(sb) return sb;
  if(!window.supabase) return null;
  sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, storageKey:'dnalabs-ops' }
  });
  return sb;
}
const emailFor = (id, code) =>
  String(id).trim().toLowerCase() + '@' + String(code).trim().toLowerCase() + '.ndna.invalid';

/* 마크는 세 앱에 박혀 있는 것과 같은 그림입니다(make-logo.py 가 넣습니다). */
const MARK = 'logo.png';
$('gateMark').src = MARK; $('topMark').src = MARK;

let me = null, page = 'co', data = null;

function toast(t){
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 2200);
}

/* ───── 서버에 물어보기 ─────
   모든 요청이 이 하나를 지나갑니다. 로그인이 끊겼으면 조용히 실패하지 않고
   들어오는 화면으로 되돌립니다 — 빈 목록을 보여 주면 "회사가 없어졌나" 로 읽힙니다. */
async function ops(action, body){
  if(!sbInit()) throw new Error('연결 준비에 실패했습니다. 새로고침해 주세요.');
  const { data:s } = await sb.auth.getSession();
  const tok = s && s.session && s.session.access_token;
  if(!tok){ showGate('다시 들어와 주세요.'); throw new Error('로그인이 끊겼습니다.'); }
  const res = await fetch(OPS, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok, 'apikey':SB_KEY },
    body: JSON.stringify(Object.assign({action}, body||{})),
  });
  let j = null;
  try { j = await res.json() } catch { throw new Error('서버가 이상한 답을 보냈습니다 ('+res.status+')') }
  if(res.status === 403){ await sb.auth.signOut().catch(()=>{}); showGate('운영자만 들어올 수 있습니다.'); throw new Error('권한이 없습니다.'); }
  if(!j || j.ok !== true) throw new Error((j && j.error) || '실패했습니다 ('+res.status+')');
  return j;
}

/* ───── 들어오기 ───── */
function showGate(msg){
  $('gate').hidden = false; $('app').hidden = true;
  $('gateMsg').textContent = msg || '';
  $('g-pw').value = '';
}
function showApp(){
  $('gate').hidden = true; $('app').hidden = false;
  $('who').textContent = me ? (me.name || me.loginId) : '';
}
$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('g-code').value.trim().toUpperCase();
  const id   = $('g-id').value.trim().toLowerCase();
  const pw   = $('g-pw').value;
  if(!code || !id || !pw){ $('gateMsg').textContent = '세 칸을 모두 채워 주세요.'; return }
  $('g-go').disabled = true; $('gateMsg').textContent = '';
  try{
    if(!sbInit()) throw new Error('연결 준비에 실패했습니다.');
    const { error } = await sb.auth.signInWithPassword({ email: emailFor(id, code), password: pw });
    if(error){
      const m = String(error.message || '');
      throw new Error(/Invalid login/i.test(m) ? '회사 코드, 아이디, 비밀번호를 확인해 주세요.' : m.slice(0,80));
    }
    await boot();
  }catch(err){
    $('gateMsg').textContent = err.message || '들어가지 못했습니다.';
    await sb.auth.signOut().catch(()=>{});
  }finally{ $('g-go').disabled = false }
});
$('signOut').addEventListener('click', async ()=>{
  await sb.auth.signOut().catch(()=>{});
  me = null; showGate('나왔습니다.');
});

/* ───── 화면 ───── */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if(!b) return;
  go(b.dataset.p);
});
function go(p){
  page = p;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.p === p)));
  $('p-co').hidden  = p !== 'co';
  $('p-log').hidden = p !== 'log';
  if(p === 'log') loadLog();
}

const APP_KO = { rebind:'Re:Bind', recall:'Re:Call', restore:'Re:Store' };
const APPS = ['rebind','recall','restore'];

function 언제(iso){
  if(!iso) return '—';
  const d = new Date(iso), now = new Date();
  const 일 = Math.floor((now - d) / 86400000);
  if(일 <= 0) return '오늘';
  if(일 === 1) return '어제';
  if(일 < 30) return 일 + '일 전';
  return String(d.getFullYear()).slice(2) + '.' + (d.getMonth()+1) + '.' + d.getDate();
}
const 날짜 = iso => !iso ? '—'
  : String(new Date(iso).getFullYear()).slice(2)+'.'+(new Date(iso).getMonth()+1)+'.'+new Date(iso).getDate();

async function loadCo(){
  const j = await ops('overview');
  data = j.companies;
  paintCo();
}
function paintCo(){
  const cs = data || [];
  const 계정 = cs.reduce((a,c)=>a+c.users, 0);
  const 쓰는곳 = { rebind:0, recall:0, restore:0 };
  for(const c of cs) for(const a of c.apps) if(쓰는곳[a] !== undefined) 쓰는곳[a]++;

  $('coSub').textContent = cs.length ? cs.length + '곳' : '아직 없습니다';
  $('sum').innerHTML =
    [['회사', cs.length], ['계정', 계정],
     ['Re:Bind', 쓰는곳.rebind], ['Re:Call', 쓰는곳.recall]]
    .map(([k,n]) => '<div class="b"><div class="n">'+num(n)+'</div><div class="k">'+esc(k)+'</div></div>').join('');

  if(!cs.length){
    $('coList').innerHTML = '<div class="tbl"><div class="empty">아직 만든 회사가 없습니다.<br>오른쪽 위 <b>회사 만들기</b> 를 누르세요.</div></div>';
    return;
  }
  $('coList').innerHTML = cs.map(c => {
    /* 쓰는 서비스에 맞는 숫자만 보여 줍니다. Re:Store 만 쓰는 회사에
       "프로젝트 0" 이 떠 있으면 안 쓰는 것인지 못 쓰는 것인지 헷갈립니다. */
    const u = [];
    if(c.apps.includes('rebind'))  u.push(['프로젝트', c.use.projects]);
    if(c.apps.includes('recall'))  u.push(['고객카드', c.use.customers], ['기록', c.use.acts]);
    if(c.apps.includes('restore')) u.push(['가맹점', c.use.stores], ['발주', c.use.orders]);
    return '<button class="co" data-id="'+c.id+'">'+
      '<div class="hd">'+
        '<span class="code">'+esc(c.code)+'</span>'+
        '<span class="name">'+esc(c.name || '(이름 없음)')+'</span>'+
        (c.disabled ? '<span class="tag off">멈춤</span>' : '')+
        '<span class="sp"></span>'+
        '<span class="apps">'+
          (c.apps.length
            ? c.apps.map(a=>'<span class="tag '+a+'">'+esc(APP_KO[a]||a)+'</span>').join('')
            : '<span class="tag none">서비스 없음</span>')+
        '</span>'+
      '</div>'+
      '<div class="use">'+
        '<span class="q">계정</span> <b>'+num(c.users)+'</b>'+
        u.map(([k,n])=>'<span><span class="q">'+esc(k)+'</span> <b>'+num(n)+'</b></span>').join('')+
        '<span class="sp"></span>'+
        '<span class="q">마지막 접속 '+esc(언제(c.lastSeen))+'</span>'+
      '</div>'+
    '</button>';
  }).join('');
  document.querySelectorAll('#coList .co').forEach(b =>
    b.addEventListener('click', ()=>openCo(b.dataset.id)));
}

async function loadLog(){
  $('logList').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const j = await ops('audit');
    $('logList').innerHTML = j.log.length ? j.log.map(r =>
      '<div class="r">'+
        '<span class="at">'+esc(날짜(r.at))+' '+esc(String(new Date(r.at).toTimeString()).slice(0,5))+'</span>'+
        '<span class="ac">'+esc(r.action)+'</span>'+
        '<span class="rest">'+esc(r.code)+' · '+esc(r.target||'—')+' · '+esc(r.who)+'</span>'+
      '</div>').join('') : '<div class="empty">아직 기록이 없습니다.</div>';
  }catch(e){ $('logList').innerHTML = '<div class="empty">'+esc(e.message)+'</div>' }
}

/* ───── 시트 ───── */
function openSheet(html){
  $('sheetCard').innerHTML = html;
  $('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('sheet').hidden = true; $('sheetCard').innerHTML = '';
  document.body.style.overflow = '';
}
$('sheet').addEventListener('click', e => { if(e.target === $('sheet')) closeSheet() });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('sheet').hidden) closeSheet() });

/* ── 회사 만들기 ── */
$('newCo').addEventListener('click', () => {
  openSheet(
    '<h3>새 회사</h3>'+
    '<p class="note">회사와 첫 관리자 계정을 함께 만듭니다. 지금까지 셸에서 하시던 일입니다.</p>'+
    '<div class="row2">'+
      '<div class="field"><label for="c-code">회사 코드</label>'+
        '<input id="c-code" class="inp" placeholder="GUDORO" maxlength="12" autocapitalize="characters" spellcheck="false"></div>'+
      '<div class="field"><label for="c-name">회사 이름</label>'+
        '<input id="c-name" class="inp" placeholder="구도로통닭"></div>'+
    '</div>'+
    '<div class="field"><label>쓸 서비스</label>'+
      '<div class="picks" id="c-apps">'+
        APPS.map(a=>'<button type="button" class="pick" data-a="'+a+'" aria-pressed="false">'+APP_KO[a]+'</button>').join('')+
      '</div>'+
      '<p class="note" style="margin:8px 0 0">하나도 안 고르면 만들어 놓고도 아무도 못 들어갑니다.</p>'+
    '</div>'+
    '<div class="row2">'+
      '<div class="field"><label for="c-id">관리자 아이디</label>'+
        '<input id="c-id" class="inp" value="admin" autocapitalize="off" spellcheck="false"></div>'+
      '<div class="field"><label for="c-nm">관리자 이름</label>'+
        '<input id="c-nm" class="inp" placeholder="관리자"></div>'+
    '</div>'+
    '<div class="field"><label for="c-pw">첫 비밀번호</label>'+
      '<input id="c-pw" class="inp" type="text" placeholder="10자 이상" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="warn">만든 뒤에는 이 비밀번호를 다시 볼 수 없습니다. 되돌릴 수 없는 형태로 저장되기 때문입니다. '+
      '고객사에 전할 방법을 정해 두고 만드세요.</div>'+
    '<div class="btnrow"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">만들기</button></div>'
  );
  $('c-apps').addEventListener('click', e => {
    const b = e.target.closest('.pick'); if(!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
  });
  $('x').addEventListener('click', closeSheet);
  $('ok').addEventListener('click', async () => {
    const apps = [...document.querySelectorAll('#c-apps .pick[aria-pressed="true"]')].map(b=>b.dataset.a);
    $('ok').disabled = true;
    try{
      const j = await ops('company-create', {
        code: $('c-code').value, name: $('c-name').value, apps,
        loginId: $('c-id').value, adminName: $('c-nm').value, password: $('c-pw').value,
      });
      closeSheet(); await loadCo();
      toast(j.code + ' 를 만들었습니다');
      openCo(j.id);
    }catch(e){ toast(e.message); $('ok').disabled = false }
  });
});

/* ── 회사 하나 ── */
async function openCo(id){
  openSheet('<div class="empty">불러오는 중…</div>');
  let j;
  try{ j = await ops('company', {id}) }catch(e){ closeSheet(); toast(e.message); return }
  const c = j.company;

  const 계정 = j.users.length ? j.users.map(u =>
    '<div class="r">'+
      '<div class="m">'+
        '<div class="t1">'+esc(u.name || u.loginId)+
          (u.role==='admin' ? ' <span class="tag rebind">관리자</span>' : '')+
          (u.disabled ? ' <span class="tag off">중지</span>' : '')+'</div>'+
        '<div class="t2">'+esc(u.loginId)+' · 마지막 접속 '+esc(언제(u.lastSeen))+'</div>'+
      '</div>'+
      '<div class="acts">'+
        '<button class="btn sm line" data-pw="'+u.id+'">비밀번호</button>'+
        '<button class="btn sm '+(u.disabled?'line':'danger')+'" data-off="'+u.id+'" data-now="'+(u.disabled?'1':'0')+'">'+
          (u.disabled ? '다시 쓰기' : '중지')+'</button>'+
      '</div>'+
    '</div>').join('') : '<div class="empty">계정이 없습니다.</div>';

  const 기록 = j.log.length ? j.log.slice(0,6).map(r =>
    '<div class="r"><span class="at">'+esc(날짜(r.at))+'</span>'+
    '<span class="rest">'+esc(r.action)+' · '+esc(r.target||'—')+'</span></div>').join('')
    : '<div class="empty">기록이 없습니다.</div>';

  openSheet(
    '<h3>'+esc(c.name || c.code)+' <span class="code" style="font-size:.7rem">'+esc(c.code)+'</span></h3>'+
    '<p class="note">'+날짜(c.createdAt)+' 에 만들었습니다.</p>'+

    '<div class="field"><label>쓰는 서비스</label>'+
      '<div class="picks" id="d-apps">'+
        APPS.map(a=>'<button type="button" class="pick" data-a="'+a+'" aria-pressed="'+
          (c.apps.includes(a)?'true':'false')+'">'+APP_KO[a]+'</button>').join('')+
      '</div>'+
      '<p class="note" style="margin:8px 0 0">누르면 바로 저장됩니다. 끄면 그 서비스의 자료를 '+
        '<b>한 줄도 못 읽습니다</b> — 지우는 것이 아니라 안 보이게 되는 것이라, 도로 켜면 그대로 돌아옵니다.</p>'+
    '</div>'+

    '<div class="field" style="margin-top:22px"><label>계정 '+j.users.length+'</label>'+
      '<div class="tbl">'+계정+'</div>'+
      '<button class="btn line sm" id="d-newu" style="width:100%;margin-top:10px">+ 계정 추가</button>'+
    '</div>'+

    '<div class="field" style="margin-top:22px"><label>구독</label>'+
      (j.sub
        ? '<div class="tbl"><div class="r"><div class="m"><div class="t1">'+esc(j.sub.plan_key||'—')+'</div>'+
          '<div class="t2">'+esc(j.sub.status||'—')+'</div></div></div></div>'
        : '<div class="warn info">아직 붙어 있지 않습니다. 요금제는 Re:Call 것만 있고, '+
          '결제대행사(PG) 계약 전이라 실제로 돈이 움직이지 않습니다. 지금은 이 회사에 구독 줄이 없습니다.</div>')+
    '</div>'+

    '<div class="field" style="margin-top:22px"><label>최근 기록</label>'+
      '<div class="tbl log">'+기록+'</div></div>'+

    '<div class="btnrow">'+
      '<button class="btn ghost" id="x">닫기</button>'+
      '<button class="btn '+(c.disabled?'line':'danger')+'" id="d-off">'+
        (c.disabled ? '회사 다시 쓰기' : '회사 멈추기')+'</button>'+
    '</div>'
  );

  $('x').addEventListener('click', closeSheet);

  $('d-apps').addEventListener('click', async e => {
    const b = e.target.closest('.pick'); if(!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    const apps = [...document.querySelectorAll('#d-apps .pick[aria-pressed="true"]')].map(x=>x.dataset.a);
    try{
      await ops('company-apps', { id, apps });
      toast(apps.length ? apps.map(a=>APP_KO[a]).join(' · ') : '서비스를 모두 껐습니다');
      await loadCo();
    }catch(err){
      b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));  // 되돌립니다
      toast(err.message);
    }
  });

  $('d-off').addEventListener('click', async () => {
    const 끌까 = !c.disabled;
    if(끌까 && !confirm(c.name+' 를 멈춥니다.\n\n지금 쓰고 있는 사람도 그 자리에서 끊깁니다.\n자료는 지워지지 않습니다.')) return;
    try{
      await ops('company-disabled', { id, disabled: 끌까 });
      toast(끌까 ? '멈췄습니다' : '다시 씁니다');
      closeSheet(); await loadCo();
    }catch(e){ toast(e.message) }
  });

  $('d-newu').addEventListener('click', () => newUser(id, c));

  document.querySelectorAll('#sheetCard [data-pw]').forEach(b =>
    b.addEventListener('click', () => resetPw(b.dataset.pw, id)));
  document.querySelectorAll('#sheetCard [data-off]').forEach(b =>
    b.addEventListener('click', async () => {
      const off = b.dataset.now !== '1';
      if(off && !confirm('이 계정을 중지합니다.\n열려 있던 로그인도 끊깁니다.')) return;
      try{ await ops('user-disabled', { userId:b.dataset.off, disabled:off }); toast(off?'중지했습니다':'다시 씁니다'); openCo(id) }
      catch(e){ toast(e.message) }
    }));
}

function newUser(companyId, c){
  openSheet(
    '<h3>계정 추가</h3>'+
    '<p class="note">'+esc(c.name || c.code)+' 에 직원 계정을 만듭니다.</p>'+
    '<div class="row2">'+
      '<div class="field"><label for="u-id">아이디</label>'+
        '<input id="u-id" class="inp" placeholder="gdhong" autocapitalize="off" spellcheck="false"></div>'+
      '<div class="field"><label for="u-nm">이름</label>'+
        '<input id="u-nm" class="inp" placeholder="홍길동"></div>'+
    '</div>'+
    '<div class="field"><label>권한</label>'+
      '<div class="picks" id="u-role">'+
        '<button type="button" class="pick" data-r="user" aria-pressed="true">직원</button>'+
        '<button type="button" class="pick" data-r="admin" aria-pressed="false">관리자</button>'+
      '</div></div>'+
    '<div class="field"><label for="u-pw">첫 비밀번호</label>'+
      '<input id="u-pw" class="inp" type="text" placeholder="10자 이상" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="warn">만든 뒤에는 다시 볼 수 없습니다.</div>'+
    '<div class="btnrow"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">만들기</button></div>'
  );
  $('u-role').addEventListener('click', e => {
    const b = e.target.closest('.pick'); if(!b) return;
    document.querySelectorAll('#u-role .pick').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  });
  $('x').addEventListener('click', ()=>openCo(companyId));
  $('ok').addEventListener('click', async () => {
    const role = (document.querySelector('#u-role .pick[aria-pressed="true"]')||{}).dataset.r || 'user';
    $('ok').disabled = true;
    try{
      await ops('user-create', { companyId, loginId:$('u-id').value, name:$('u-nm').value, role, password:$('u-pw').value });
      toast('만들었습니다'); await loadCo(); openCo(companyId);
    }catch(e){ toast(e.message); $('ok').disabled = false }
  });
}

function resetPw(userId, companyId){
  openSheet(
    '<h3>비밀번호 재발급</h3>'+
    '<p class="note">새 비밀번호를 정해 주세요. 지금 열려 있는 로그인은 모두 끊깁니다.</p>'+
    '<div class="field"><label for="r-pw">새 비밀번호</label>'+
      '<input id="r-pw" class="inp" type="text" placeholder="10자 이상" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="warn stop">바꾸고 나면 다시 볼 수 없습니다. 전할 방법을 정해 두고 누르세요.</div>'+
    '<div class="btnrow"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">바꾸기</button></div>'
  );
  $('x').addEventListener('click', ()=>openCo(companyId));
  $('ok').addEventListener('click', async () => {
    $('ok').disabled = true;
    try{
      await ops('user-reset-password', { userId, password:$('r-pw').value });
      toast('바꿨습니다'); openCo(companyId);
    }catch(e){ toast(e.message); $('ok').disabled = false }
  });
}

/* ───── 시작 ───── */
async function boot(){
  if(!sbInit()){ showGate('연결 준비에 실패했습니다. 새로고침해 주세요.'); return }
  const { data:s } = await sb.auth.getSession();
  if(!s || !s.session){ showGate(''); return }
  try{
    const j = await ops('me');
    me = j.me;
    showApp(); go('co'); await loadCo();
  }catch(e){
    /* ops() 안에서 이미 들어오는 화면으로 되돌렸습니다.
       여기까지 오면 그 밖의 이유(네트워크 등)입니다. */
    if($('app').hidden === false) showGate(e.message);
  }
}
boot();
</script>
